<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Math</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-container">
            <a href="#" class="brand" id="nav-home">Breaking Math</a>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search formulas, categories..." autocomplete="off">
            </div>

            <div class="nav-actions">
                <button id="btn-login" class="btn btn-secondary">Login</button>
                <button id="theme-toggle" class="btn-icon">🌓</button>
            </div>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <h3 class="sidebar-title">Categories</h3>
            <ul id="category-list" class="category-list"></ul>
        </aside>

        <main class="main-content">
            <section id="view-explorer" class="view-section">
                <h1 id="explorer-title">All Formulas</h1>
                <div id="formula-grid" class="formula-grid"></div>
            </section>

            <section id="view-calculator" class="view-section hidden">
                <div class="calc-header">
                    <div>
                        <span class="text-caption" id="calc-category"></span>
                        <h2 id="calc-title"></h2>
                        <p class="text-muted" id="calc-desc"></p>
                    </div>
                    <button class="btn btn-secondary" id="btn-back">Close Calculator</button>
                </div>

                <div id="calc-latex" class="math-display"></div>

                <div class="calc-grid">
                    <div class="input-panel">
                        <h3>Variables</h3>
                        <form id="calc-form">
                            <div id="calc-inputs" class="inputs-container"></div>
                            <div class="button-group">
                                <button type="submit" class="btn btn-primary">Calculate</button>
                                <button type="button" class="btn btn-secondary" id="btn-reset">Reset</button>
                            </div>
                        </form>
                        <div id="calc-error" class="error-msg hidden"></div>
                    </div>

                    <div class="output-panel">
                        <div id="calc-results" class="hidden">
                            <h3>Calculation Steps</h3>
                            <div id="calc-steps" class="steps-container"></div>
                            <div id="calc-final" class="final-result"></div>

                            <div id="calc-vis" class="visualization-container hidden">
                                <h3>Visualization</h3>
                                <div class="canvas-wrapper">
                                    <canvas id="math-canvas"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Sign In</h2>
            <p class="text-muted" style="margin-bottom: 24px;">Calculators are free to use without logging in.</p>
            <div class="input-group">
                <label>Email</label>
                <input type="email" class="input-control">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" class="input-control">
            </div>
            <div class="button-group" style="margin-top: 24px;">
                <button class="btn btn-primary" style="flex: 1;">Sign In</button>
                <button class="btn btn-secondary" id="btn-close-modal">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
